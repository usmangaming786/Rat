name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Build APK
      run: |
        unzip -q code.zip -d extracted_project
        GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Project mila is folder mein: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Compiled APK
      uses: actions/upload-artifact@v4
      with:
        name: Built-APK
        path: "**/*.apk"
        
